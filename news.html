<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS詳細 | しゅしゅどーる</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ニュース詳細ページ用のスタイル定義 */
        .news-detail-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ccc;
        }

        .news-detail-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4a3b52;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .news-detail-body {
            line-height: 1.8;
            color: #333;
            font-size: 1rem;
            margin-bottom: 40px;
        }

        .news-detail-body p {
            margin-bottom: 1em;
        }

        /* 記事内画像の調整用 */
        .news-detail-body img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="logo.jpeg" alt="しゅしゅどーる 公式ロゴ">
        </div>

        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav class="nav" id="nav-menu">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="news.html">NEWS</a></li>
                <li><a href="index.html#schedule">SCHEDULE</a></li>
                <li><a href="index.html#system">SYSTEM</a></li>
                <li><a href="profile.html">PROFILE</a></li>
                <li><a href="index.html#access">ACCESS</a></li>
                <li><a href="reservation.html">RESERVATION</a></li>
                <li><a href="index.html#shop">SHOP</a></li>
            </ul>
        </nav>
    </header>

    <section id="news-detail" class="container" style="margin-top: 100px;">
        <!-- 日付 & カテゴリ -->
        <div class="news-detail-header">
            <span class="date">2026.05.25</span>
        </div>

        <!-- ニュースのタイトル -->
        <h1 class="news-detail-title">ゆいにゃさんが本日からP衣装となります</h1>

        <!-- ニュース本文 -->
        <div class="news-detail-body">
            <p>いつも「しゅしゅどーる」をご愛顧いただきありがとうございます！</p>
            <p>本日より、ゆいにゃさんがプロデューサー衣装となります！</p>
            <p>皆様のご来店をキャスト・スタッフ一同心よりお待ちしております！</p>
            <p class="news-author">ないきん</p>
        </div>

        <!-- 戻るボタン -->
        <div class="view-more" style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
            <a href="index.html#news">HOMEへ戻る</a>
            <!-- news.html（一覧ページ）も作っている場合は以下も活用できます -->
            <!-- <a href="news.html">NEWS一覧へ戻る</a> -->
        </div>
    </section>

    <footer class="footer">
        <p>&copy; しゅしゅどーる</p>
    </footer>

    <!-- ハンバーガーメニュー JavaScript -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        document.querySelectorAll('.nav ul li a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                navMenu.classList.remove('active');
            });
        });
    </script>
</body>
</html>
