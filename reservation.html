<script>
    // ★ 店舗宛ての通知先メールアドレス
    const STORE_EMAIL = "Chouchoudoll2026@gmail.com"; 

    // ハンバーガーメニュー制御
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');

    if (hamburger && navMenu) {
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });
    }

    // 本日以降の日付のみ選択可能にする
    const dateInput = document.getElementById('res-date');
    if (dateInput) {
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);
    }

    // --- 9月12日・13日のみ「1部・2部・3部」にする切り替え処理 ---
    const timeSelect = document.getElementById('res-time');
    const labelText = document.getElementById('label-text');
    const eventNote = document.getElementById('event-note');

    const normalOptionsHTML = `
        <option value="">時間を選択してください</option>
        <option value="18:00">18:00</option>
        <option value="18:30">18:30</option>
        <option value="19:00">19:00</option>
        <option value="19:30">19:30</option>
        <option value="20:00">20:00</option>
        <option value="20:30">20:30</option>
        <option value="21:00">21:00</option>
        <option value="21:30">21:30</option>
        <option value="22:00">22:00</option>
    `;

    const specialPartOptionsHTML = `
        <option value="">部を選択してください</option>
        <option value="1部">1部</option>
        <option value="2部">2部</option>
        <option value="3部">3部</option>
    `;

    if (dateInput) {
        dateInput.addEventListener('change', (e) => {
            const val = e.target.value; // YYYY-MM-DD
            if (!val) return;

            const parts = val.split('-');
            const month = parts[1];
            const day = parts[2];

            if (month === '09' && (day === '12' || day === '13')) {
                if (labelText) labelText.textContent = 'ご来店区分';
                if (timeSelect) timeSelect.innerHTML = specialPartOptionsHTML;
                if (eventNote) eventNote.style.display = 'block';
            } else {
                if (labelText) labelText.textContent = 'ご来店時間';
                if (timeSelect) timeSelect.innerHTML = normalOptionsHTML;
                if (eventNote) eventNote.style.display = 'none';
            }
        });
    }

    // --- メール送信＆フォーム送信処理 ---
    const form = document.getElementById('reservationForm');
    const modal = document.getElementById('successModal');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const submitBtn = form ? form.querySelector('.submit-btn') : null;

    if (form) {
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            if (!STORE_EMAIL || STORE_EMAIL === "") {
                alert("【設定エラー】店舗のメールアドレスが設定されていません。");
                return;
            }

            // 二重送信防止
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = '送信中...';
            }

            // 入力データ取得
            const date = document.getElementById('res-date').value; // 例: 2026-08-15
            const time = document.getElementById('res-time').value; // 例: 18:00
            const duration = document.getElementById('res-duration').value;
            const guests = document.getElementById('res-guests').value;
            const name = document.getElementById('user-name').value;
            const userEmail = document.getElementById('user-email').value;

            // ★ Gmail/スマホで自動リンク化させるための「日本語日時フォーマット」を生成
            let formattedDateTime = "";
            if (date) {
                const parts = date.split('-'); // ["2026", "08", "15"]
                formattedDateTime = `${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日 ${time}`;
            }

            // 送信用データの準備
            const formData = new FormData(form);
            
            // ★ カレンダー自動認識用の統合日時フィールドを追加
            formData.append("【カレンダー用】ご来店日時", formattedDateTime);

            formData.append("_subject", `【しゅしゅどーる】Web予約リクエスト (${name}様 / ${formattedDateTime})`);
            formData.append("_template", "table"); 
            formData.append("_captcha", "false");

            // お客様宛への自動返信メールメッセージ本文
            formData.append("_autorespond", `${name} 様\n\nご来店予約のリクエストを承りました。\n内容を確認の上、店舗より折り返しご連絡いたします。\n\n【予約内容】\n・ご来店日時：${formattedDateTime}\n・人数：${guests}\n・予定滞在時間：${duration}\n\n--------------------\nしゅしゅど～る\n〒160-0021 東京都新宿区歌舞伎町2丁目14-12 光凛ビル B1F`);
            
            formData.append("_replyto", userEmail);

            // FormSubmit APIを通じて送信
            fetch(`https://formsubmit.co/ajax/${STORE_EMAIL}`, {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                // 送信成功時のモーダル表示
                document.getElementById('modalMsg').innerHTML = `
                    ${name} 様<br><br>
                    <strong>${formattedDateTime}</strong><br>
                    （${guests} / 滞在予定：${duration}）のご来店予約を受け付けました。<br><br>
                    内容を確認の上、店舗より折り返しご連絡差し上げます。
                `;
                modal.style.display = 'flex';
            })
            .catch(error => {
                console.error('Error:', error);
                alert('送信に失敗しました。お手数ですが、時間をおいて再度お試しいただくかSNSダイレクトメッセージよりご連絡ください。');
            })
            .finally(() => {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '予約を送信する';
                }
            });
        });
    }

    if (modalCloseBtn) {
        modalCloseBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            form.reset();
            if (labelText) labelText.textContent = 'ご来店時間';
            if (timeSelect) timeSelect.innerHTML = normalOptionsHTML;
            if (eventNote) eventNote.style.display = 'none';
        });
    }
</script>
